<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Zona de Juegos (Web)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>

    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="logo">
    <h2>🎮 Zona de Juegos (Versión Web) 🎮</h2>

    <form method="POST">
        <input type="text" id="busqueda" name="busqueda" placeholder="Buscar juego...">
        <button type="submit">Buscar</button>
    </form>

    <table>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Género</th>
            <th>Clasificación</th>
            <th>Plataforma</th>
        </tr>
        {% for juego in videojuegos %}
        <tr>
            <td>{{ juego[0] }}</td>
            <td>{{ juego[1] }}</td>
            <td>{{ juego[2] }}</td>
            <td>{{ juego[3] }}</td>
            <td>{{ juego[4] }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
